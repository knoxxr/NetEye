# NetEye macOS 설정 파일 (KEY=VALUE)
# 바꾼 뒤 서비스 재시작:
#   sudo launchctl kickstart -k system/com.neteye.sensor
# 수집 인터페이스는 대시보드의 [패킷 수집 설정]에서 고르면 이 파일에 저장됩니다.

# 대시보드 수신 주소. 다른 PC에서 접속하려면 0.0.0.0 으로 바꾸고 NETEYE_ALLOWED_HOSTS 를 설정하세요.
NETEYE_HOST=127.0.0.1
NETEYE_PORT=8000
#NETEYE_ALLOWED_HOSTS=mac-sensor.local,192.168.10.5

NETEYE_DB=/Library/Application Support/NetEye/neteye.bdb
NETEYE_VULNDB=/Library/Application Support/NetEye/vulndb.json
NETEYE_IPASN=/Library/Application Support/NetEye/ip2asn-v4.tsv.gz
NETEYE_BLOCKLIST=/Library/Application Support/NetEye/blocklist.txt

# 패킷 수집 인터페이스 (예: en0). 비워 두면 PCAP 분석만 합니다.
NETEYE_INTERFACE=

# 공인 IP 대역을 내부망으로 쓰는 현장: 내부 대역 (쉼표로 구분)
#NETEYE_INTERNAL_NETS=166.161.0.0/16

# SIEM 전송 (syslog): udp://주소:514 또는 tcp://주소:6514
#NETEYE_SYSLOG=udp://192.168.10.20:514
#NETEYE_SYSLOG_FORMAT=cef
