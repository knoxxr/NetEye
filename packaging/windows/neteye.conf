# NetEye 설정 파일 (KEY=VALUE, ${ProgramData} 같은 환경 변수 사용 가능)
# 바꾼 뒤 서비스 재시작:  Restart-Service NetEye   (관리자 PowerShell)
# 수집 랜카드는 대시보드의 [패킷 수집 설정]에서 고르면 이 파일에 저장됩니다.

# 대시보드 수신 주소. 다른 PC에서 접속하려면 0.0.0.0 으로 바꾸고 NETEYE_ALLOWED_HOSTS 에
# 이 센서의 이름이나 IP를 적은 뒤, Windows 방화벽에서 포트를 여세요.
NETEYE_HOST=127.0.0.1
NETEYE_PORT=8000
#NETEYE_ALLOWED_HOSTS=sensor01,192.168.10.5

NETEYE_DB=${ProgramData}\NetEye\neteye.bdb
NETEYE_VULNDB=${ProgramData}\NetEye\vulndb.json
NETEYE_IPASN=${ProgramData}\NetEye\ip2asn-v4.tsv.gz
NETEYE_BLOCKLIST=${ProgramData}\NetEye\blocklist.txt

# 패킷 수집 랜카드 (\Device\NPF_{...}). 비워 두면 PCAP 분석만 합니다.
NETEYE_INTERFACE=

# 공인 IP 대역을 내부망으로 쓰는 현장: 내부 대역 (쉼표로 구분)
#NETEYE_INTERNAL_NETS=166.161.0.0/16

# SIEM 전송 (syslog): udp://주소:514 또는 tcp://주소:6514
#NETEYE_SYSLOG=udp://192.168.10.20:514
#NETEYE_SYSLOG_FORMAT=cef
