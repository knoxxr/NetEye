<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <title>NetEye | 로그인</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="brand login-brand">
        <span class="brand-mark">N</span>
        <span>NETEYE <small>OT VISIBILITY</small></span>
      </div>

      <form id="login-form" class="login-card" autocomplete="on">
        <h1>로그인</h1>
        <p class="subtitle">OT 보안 모니터에 접근하려면 계정으로 로그인하세요.</p>
        <label>사용자 이름
          <input id="username" name="username" autocomplete="username" required autofocus>
        </label>
        <label>비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="button primary" type="submit">로그인</button>
      </form>

      <form id="change-form" class="login-card" hidden>
        <h1>비밀번호 변경</h1>
        <p class="subtitle">처음 로그인했거나 관리자가 비밀번호를 재설정했습니다. 계속하려면 새 비밀번호를 정하세요 (10자 이상).</p>
        <label>현재 비밀번호
          <input id="current" type="password" autocomplete="current-password" required>
        </label>
        <label>새 비밀번호
          <input id="new-password" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <label>새 비밀번호 확인
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <p id="change-error" class="form-error" role="alert" hidden></p>
        <button class="button primary" type="submit">변경하고 계속</button>
      </form>
    </main>
    <script src="/assets/login.js" defer></script>
  </body>
</html>
