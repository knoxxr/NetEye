<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <title>NetEye | Sign In</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="brand login-brand">
        <span class="brand-mark">N</span>
        <span>NETEYE <small>OT VISIBILITY</small></span>
      </div>

      <form id="login-form" class="login-card" autocomplete="on">
        <h1>Sign In</h1>
        <p class="subtitle">Sign in to access the NetEye OT Security Monitor dashboard.</p>
        <label>Username
          <input id="username" name="username" autocomplete="username" required autofocus>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="button primary" type="submit">Sign In</button>
      </form>

      <form id="change-form" class="login-card" hidden>
        <h1>Change Password</h1>
        <p class="subtitle">First sign-in or administrator password reset detected. Choose a new password (minimum 10 characters) to continue.</p>
        <label>Current Password
          <input id="current" type="password" autocomplete="current-password" required>
        </label>
        <label>New Password
          <input id="new-password" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <label>Confirm New Password
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required>
        </label>
        <p id="change-error" class="form-error" role="alert" hidden></p>
        <button class="button primary" type="submit">Update Password &amp; Continue</button>
      </form>

      <div class="login-links">
        <a href="https://github.com/knoxxr/NetEye/issues/new/choose" target="_blank" rel="noopener noreferrer">GitHub Issues</a>
        <span>·</span>
        <a href="https://github.com/knoxxr/NetEye/discussions" target="_blank" rel="noopener noreferrer">GitHub Discussions</a>
      </div>
    </main>
    <script src="/assets/login.js" defer></script>
  </body>
</html>
